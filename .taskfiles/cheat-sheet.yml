version: '3'

tasks:
  go:
    desc: Goモジュール開発で使用するコマンドを表示
    silent: true
    cmds:
      - |
        cat <<'EOF'
        [ Go ]
          go mod tidy
          go test -v ./...
          go build -v ./...
          golangci-lint run
        EOF

  docs:
    desc: 仕様書とTODOの配置を表示
    silent: true
    cmds:
      - |
        cat <<'EOF'
        [ Documents ]
          docs/spec.md
          docs/pkg/madb/spec.md
          docs/todo/
          docs/backlog.md
          docs/idea.md
        EOF

  git:
    desc: Git commands
    silent: true
    cmds:
      - |
        cat <<'EOF'
        [ Git ]
          - 直前コミットのメッセージ修正
            git commit --amend

          - ファイル追加して直前コミットへ
            git add .
            git commit --amend --no-edit

          - 直前コミットを取り消す（変更は残す）
            git reset --soft HEAD^

          - コミットだけ消してステージも解除
            git reset HEAD^

          - 全部取り消す
            # 追跡対象の未コミット変更を破棄するため、実行前に確認する
            git reset --hard HEAD^

          - Push済みコミットを書き換えた後
            # リモート履歴を上書きし得るため、共有ブランチでは実行しない
            git push --force-with-lease

          - 直前ではないコミットメッセージを書き換える
            git rebase -i HEAD~10
            - 書き換えたいコミットの pick を reword に変更
            - 変更後に保存して終了すると、コミットメッセージの編集画面が表示されるので修正する
        EOF
